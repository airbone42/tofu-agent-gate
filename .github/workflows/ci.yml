name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
      - name: Paket installieren
        run: python -m pip install .
      - name: Console-Script vorhanden
        run: tofu-agent-gate --help
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - run: python -m unittest discover -s tests -v
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks
        # Lauf als Runner-User, sonst lehnt git die gemountete Arbeitskopie als "dubious ownership" ab.
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 git /repo --redact -v --exit-code 1
