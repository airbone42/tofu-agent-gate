[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tofu-agent-gate"
version = "0.1.0"
description = "Policy gate, Telegram approval and dead-man rollback around OpenTofu for agent-proposed changes"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Tobias Zander" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Systems Administration",
]
dependencies = ["PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/airbone42/tofu-agent-gate"
Changelog = "https://github.com/airbone42/tofu-agent-gate/blob/main/CHANGELOG.md"

[project.scripts]
tofu-agent-gate = "tofu_agent_gate.cli:main"

[tool.setuptools.packages.find]
include = ["tofu_agent_gate*"]
